    <style>
        :root {
            --bg-main: #f1f5f9; --card-bg: #ffffff; --text-main: #0f172a; --text-muted: #64748b; --border-color: #cbd5e1;
            --color-success: #10b981; --color-warning: #f59e0b; --color-danger: #ef4444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: var(--bg-main); color: var(--text-main); padding: 12px; display: flex; gap: 12px; height: 100vh; overflow: hidden; }
        .year-container { flex: 1; background: var(--card-bg); border-radius: 8px; border: 1px solid var(--border-color); padding: 12px; display: flex; flex-direction: column; overflow-y: auto; }
        .year-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding-bottom: 8px; border-bottom: 2px solid var(--border-color); }
        .months-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
        .month-box { background: #fff; border: 1px solid var(--border-color); border-radius: 6px; padding: 8px; }
        .month-name { font-size: 0.85rem; font-weight: 700; color: #1e293b; margin-bottom: 6px; text-transform: uppercase; text-align: center; }
        .days-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; text-align: center; }
        .weekday-label { font-size: 0.6rem; font-weight: 700; color: var(--text-muted); padding-bottom: 2px; }
        .day-cell { background: #fff; border: 1px solid var(--border-color); border-radius: 4px; min-height: 28px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 0.7rem; font-weight: 600; cursor: pointer; position: relative; border-style: solid; border-width: 1px; }
        .day-cell.empty { background: #f8fafc; border: none; cursor: default; pointer-events: none; }
        .day-cell.active { outline: 2px solid #0f172a; z-index: 10; font-weight: 800; }
        .dot { width: 4px; height: 4px; border-radius: 50%; position: absolute; bottom: 2px; }
        .dot-green { background: var(--color-success); }
        .dot-orange { background: var(--color-warning); }
        .dot-red { background: var(--color-danger); }
        .side-panel { width: 340px; display: flex; flex-direction: column; gap: 12px; height: 100%; }
        .detail-container { flex: 1; background: var(--card-bg); border-radius: 8px; border: 1px solid var(--border-color); padding: 15px; overflow-y: auto; }
        .totales-container { background: var(--card-bg); border-radius: 8px; border: 1px solid var(--border-color); padding: 15px; height: 280px; overflow-y: auto; }
        .detail-empty { text-align: center; color: var(--text-muted); margin-top: 30px; font-size: 0.8rem; }
        .metric-card { background: #f8fafc; border: 1px solid var(--border-color); border-radius: 6px; padding: 6px; margin-top: 6px; }
        .metric-card p { font-size: 0.65rem; color: var(--text-muted); margin: 0; }
        .metric-card span { font-size: 0.85rem; font-weight: 700; margin: 0; }
        .totales-title { font-size: 0.9rem; font-weight: 700; border-bottom: 2px solid var(--border-color); padding-bottom: 4px; margin-bottom: 8px; text-transform: uppercase; color: #1e293b; }
        .sub-permiso { font-size: 0.75rem; color: #475569; padding-left: 6px; border-left: 3px solid #1e293b; margin-top: 4px; font-weight: 600; }
    </style>
</head>
